<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>PyStudio — Ultra-Fast Python 3 Web IDE</title>

  <!-- Preconnect to CDNs for Instant Loading -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- CodeMirror 5 Core & Addons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>

  <style>
    :root {
      --bg-base: #0d1117;
      --bg-surface: #131822;
      --bg-elevated: #1a2232;
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-glow: rgba(99, 102, 241, 0.45);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-secondary: #06b6d4;
      --success: #10b981;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 12% 0%, rgba(99, 102, 241, 0.12), transparent 36%),
        radial-gradient(circle at 88% 100%, rgba(6, 182, 212, 0.08), transparent 36%);
    }

    /* Header */
    .topbar {
      height: 52px;
      min-height: 52px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(19, 24, 34, 0.96);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .badge-ver {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    /* Blinking Green Dot */
    .runtime-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      box-shadow: 0 0 8px var(--warning);
    }

    .runtime-status.ready .status-dot {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
      animation: blinkGreen 1.1s ease-in-out infinite;
    }

    .runtime-status.running .status-dot {
      background: var(--accent-secondary);
      box-shadow: 0 0 12px var(--accent-secondary);
      animation: blinkCyan 0.6s ease-in-out infinite;
    }

    @keyframes blinkGreen {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px #10b981, 0 0 18px rgba(16, 185, 129, 0.6); }
      50% { opacity: 0.22; transform: scale(0.75); box-shadow: 0 0 2px #10b981; }
    }

    @keyframes blinkCyan {
      0%, 100% { opacity: 1; transform: scale(1.1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Action Toolbar */
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      transition: transform 0.1s ease, background 0.15s ease;
      user-select: none;
      touch-action: manipulation;
    }

    .btn:hover { background: #232d42; }
    .btn:active { transform: scale(0.95); }

    .btn-run {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #fff;
      padding: 0 15px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.32);
    }

    .btn-stop {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      border: none;
      color: #fff;
      padding: 0 12px;
      display: none;
    }

    .btn-stop.visible { display: inline-flex; }

    /* Workspace */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg-surface);
    }

    /* Multi-File Bar */
    .file-bar {
      height: 40px;
      min-height: 40px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: rgba(13, 17, 23, 0.88);
      border-bottom: 1px solid var(--border-subtle);
    }

    .file-tabs-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      min-width: 0;
    }

    .file-tabs-scroll::-webkit-scrollbar { display: none; }

    .file-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 8px 0 10px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .file-tab-btn.active {
      background: rgba(99, 102, 241, 0.18);
      border-color: rgba(99, 102, 241, 0.45);
      color: #fff;
      font-weight: 600;
    }

    .file-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
    }

    .tab-action-icon {
      font-size: 12px;
      color: var(--text-muted);
      padding: 0 3px;
      border-radius: 4px;
      line-height: 1.2;
    }

    .tab-action-icon.rename:hover {
      color: #fff;
      background: rgba(6, 182, 212, 0.35);
    }

    .tab-action-icon.close:hover {
      color: #fff;
      background: rgba(244, 63, 94, 0.4);
    }

    .file-actions-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-file-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.14);
      color: #6ee7b7;
    }

    .btn-import-file {
      border-color: rgba(6, 182, 212, 0.38);
      background: rgba(6, 182, 212, 0.14);
      color: #67e8f9;
    }

    .pane-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      margin-left: 4px;
    }

    /* CodeMirror Theme */
    .editor-wrapper {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100% !important;
      width: 100% !important;
      background: transparent !important;
      color: #e2e8f0 !important;
      font-family: var(--font-mono) !important;
      font-size: 14.5px;
      line-height: 1.62;
      padding: 8px 0;
    }

    .CodeMirror-scroll {
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .CodeMirror-gutters {
      background: rgba(13, 17, 23, 0.5) !important;
      border-right: 1px solid var(--border-subtle) !important;
      padding-right: 4px;
    }

    .CodeMirror-linenumber { color: #475569 !important; font-size: 12px; }
    .CodeMirror-cursor { border-left: 2px solid #38bdf8 !important; }
    .CodeMirror-selected { background: rgba(99, 102, 241, 0.28) !important; }

    /* Live Error Line Highlight (VS Code Style) */
    .cm-error-line {
      background: rgba(244, 63, 94, 0.18) !important;
      border-bottom: 1.5px wavy #f43f5e;
    }

    /* Syntax Highlighting */
    .cm-s-default .cm-keyword { color: #c084fc; font-weight: 600; }
    .cm-s-default .cm-builtin { color: #38bdf8; }
    .cm-s-default .cm-def { color: #60a5fa; font-weight: 600; }
    .cm-s-default .cm-variable { color: #e2e8f0; }
    .cm-s-default .cm-string { color: #4ade80; }
    .cm-s-default .cm-number { color: #fb923c; }
    .cm-s-default .cm-comment { color: #64748b; font-style: italic; }
    .cm-s-default .cm-operator { color: #7dd3fc; }
    .cm-s-default .cm-atom { color: #f87171; }

    /* Autocomplete Dropdown */
    .CodeMirror-hints {
      background: rgba(20, 26, 38, 0.98) !important;
      border: 1px solid var(--border-glow) !important;
      border-radius: 10px !important;
      padding: 4px !important;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65) !important;
      font-family: var(--font-mono) !important;
      font-size: 13px !important;
      z-index: 9999 !important;
      max-height: 200px !important;
      overflow-y: auto !important;
    }

    .CodeMirror-hint {
      color: var(--text-primary) !important;
      padding: 6px 10px !important;
      border-radius: 6px !important;
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    li.CodeMirror-hint-active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(6, 182, 212, 0.25)) !important;
      color: #fff !important;
    }

    .hint-kind {
      font-size: 10px;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
    }

    /* Live Syntax Diagnostic Bar */
    .live-lint-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 5px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(16, 185, 129, 0.08);
      border-top: 1px solid var(--border-subtle);
      color: #6ee7b7;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .live-lint-bar.has-error {
      background: rgba(244, 63, 94, 0.16);
      border-top-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
      cursor: pointer;
    }

    .lint-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      flex-shrink: 0;
    }

    .live-lint-bar.has-error .lint-badge {
      background: rgba(244, 63, 94, 0.28);
      color: #fb7185;
    }

    .lint-msg {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Shortcut Symbol Bar */
    .shortcut-keys {
      display: flex;
      align-items: center;
      height: 44px;
      min-height: 44px;
      background: #0f141e;
      border-top: 1px solid var(--border-subtle);
      padding: 4px 10px;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .shortcut-keys::-webkit-scrollbar { display: none; }

    .shortcut-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-right: 4px;
      white-space: nowrap;
    }

    .key-chip {
      flex: 0 0 auto;
      min-width: 40px;
      height: 32px;
      padding: 0 11px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key-chip:active {
      background: var(--accent-primary);
      color: #fff;
      transform: scale(0.95);
    }

    /* Instant Full-Screen Output Page (Zero-Latency VS Code Speed) */
    .output-page {
      position: fixed;
      inset: 0;
      background: #0d1117;
      z-index: 5000;
      display: none;
      flex-direction: column;
      animation: pageSlideIn 0.14s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .output-page.open {
      display: flex;
    }

    @keyframes pageSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .output-header {
      height: 52px;
      min-height: 52px;
      padding: 0 14px;
      background: #131822;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .output-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.45);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .output-file-label {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .output-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .exec-meta {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .output-console {
      flex: 1;
      min-height: 0;
      padding: 18px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.65;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .out-line {
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 2px;
    }

    .out-line.system { color: #64748b; font-size: 12.5px; }

    .out-line.stderr {
      color: #fda4af;
      background: rgba(244, 63, 94, 0.1);
      border-left: 3px solid #f43f5e;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      margin: 8px 0;
    }

    .out-line.done {
      color: #6ee7b7;
      font-size: 12.5px;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed rgba(148, 163, 184, 0.2);
    }

    .stdin-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(99, 102, 241, 0.45);
    }

    .stdin-prompt { color: #7dd3fc; white-space: pre-wrap; }

    .stdin-input {
      flex: 1;
      min-width: 60px;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 14px;
    }

    /* Modal (Create & Rename File) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10000;
    }

    .modal-backdrop.open { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }

    .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .modal-desc { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 12px; }

    .modal-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 9px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: var(--bg-base);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 13.5px;
      outline: none;
      margin-bottom: 14px;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 84px;
      right: 16px;
      padding: 9px 14px;
      border-radius: 10px;
      background: rgba(26, 34, 50, 0.96);
      border: 1px solid var(--border-glow);
      color: #fff;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10001;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 820px) {
      .runtime-status .status-label,
      .btn .btn-label-hide-sm,
      .pane-meta,
      .shortcut-label {
        display: none;
      }
      .runtime-status { padding: 5px 8px; }
      .CodeMirror { font-size: 14px; }
    }
  </style>
</head>
<body>
  <input type="file" id="importFileInput" accept=".py,.txt,.csv,.json" multiple style="display:none" />

  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">Py</div>
      <div class="brand-title">
        <span>PyStudio</span>
        <span class="badge-ver">3.12</span>
      </div>
      <div id="runtimeStatus" class="runtime-status" title="Dedicated WebWorker Python Engine">
        <span class="status-dot"></span>
        <span id="statusText" class="status-label">Booting Engine...</span>
      </div>
    </div>

    <div class="toolbar-actions">
      <button id="copyBtn" class="btn" title="Copy Code">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span class="btn-label-hide-sm">Copy</span>
      </button>

      <button id="downloadBtn" class="btn" title="Download Active .py File">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

      <!-- File Tabs + Import + New File -->

  <!-- Instant Full-Screen Output Page (Zero-Latency VS Code Terminal Speed) -->
  <section id="outputPage" class="output-page" aria-label="Python Output Page">
    <header class="output-header">
      <div class="output-title-group">
        <button id="backToEditorBtn" type="button" class="btn-back">← Editor</button>
        <span id="outputFileTitle" class="output-file-label">main.py</span>
      </div>
      <div class="output-actions">
        <span id="execMeta" class="exec-meta">Ready</span>
        <button id="stopRunBtn" type="button" class="btn btn-stop">■ Stop</button>
        <button id="rerunBtn" type="button" class="btn btn-run" style="height:34px;padding:0 12px;">↻ Re-Run</button>
      </div>
    </header>
    <main id="outputConsole" class="output-console"></main>
  </section>

  <!-- Create / Rename File Modal -->
  <div id="fileModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="fileModalTitle" class="modal-title">Create New File</div>
      <div id="fileModalDesc" class="modal-desc">Enter any file name (e.g. <code>helper.py</code> or <code>calc</code>).</div>
      <input id="fileModalInput" type="text" class="modal-input" placeholder="my_script.py" autocomplete="off" />
      <div class="modal-actions">
        <button id="cancelFileModalBtn" type="button" class="btn">Cancel</button>
        <button id="confirmFileModalBtn" type="button" class="btn btn-run">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // 1. Python Autocomplete Dictionary
    const PYTHON_COMPLETIONS = [
      { text: "print", kind: "func" }, { text: "input", kind: "func" },
      { text: "range", kind: "func" }, { text: "len", kind: "func" },
      { text: "int", kind: "type" }, { text: "str", kind: "type" },
      { text: "float", kind: "type" }, { text: "bool", kind: "type" },
      { text: "list", kind: "type" }, { text: "dict", kind: "type" },
      { text: "set", kind: "type" }, { text: "tuple", kind: "type" },
      { text: "def", kind: "kw" }, { text: "return", kind: "kw" },
      { text: "if", kind: "kw" }, { text: "elif", kind: "kw" },
      { text: "else", kind: "kw" }, { text: "for", kind: "kw" },
      { text: "while", kind: "kw" }, { text: "break", kind: "kw" },
      { text: "continue", kind: "kw" }, { text: "pass", kind: "kw" },
      { text: "import", kind: "kw" }, { text: "from", kind: "kw" },
      { text: "as", kind: "kw" }, { text: "class", kind: "kw" },
      { text: "try", kind: "kw" }, { text: "except", kind: "kw" },
      { text: "finally", kind: "kw" }, { text: "raise", kind: "kw" },
      { text: "with", kind: "kw" }, { text: "lambda", kind: "kw" },
      { text: "yield", kind: "kw" }, { text: "True", kind: "val" },
      { text: "False", kind: "val" }, { text: "None", kind: "val" },
      { text: "and", kind: "kw" }, { text: "or", kind: "kw" },
      { text: "not", kind: "kw" }, { text: "in", kind: "kw" },
      { text: "is", kind: "kw" }, { text: "enumerate", kind: "func" },
      { text: "zip", kind: "func" }, { text: "map", kind: "func" },
      { text: "filter", kind: "func" }, { text: "sorted", kind: "func" },
      { text: "sum", kind: "func" }, { text: "min", kind: "func" },
      { text: "max", kind: "func" }, { text: "abs", kind: "func" },
      { text: "round", kind: "func" }, { text: "open", kind: "func" }
    ];

    function pythonHintProvider(cm) {
      const cur = cm.getCursor();
      const token = cm.getTokenAt(cur);
      const word = token.string;
      if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(word)) return null;

      const lower = word.toLowerCase();
      const seen = new Set();
      const matches = [];

      for (const item of PYTHON_COMPLETIONS) {
        if (item.text.toLowerCase().startsWith(lower) && item.text !== word) {
          seen.add(item.text);
          matches.push({
            text: item.text,
            render(el) {
              el.innerHTML = `<span>${item.text}</span><span class="hint-kind">${item.kind}</span>`;
            }
          });
        }
      }

      const docWords = cm.getValue().match(/\b[a-zA-Z_][a-zA-Z0-9_]{1,}\b/g) || [];
      for (const w of docWords) {
        if (!seen.has(w) && w !== word && w.toLowerCase().startsWith(lower)) {
          seen.add(w);
          matches.push({
            text: w,
            render(el) {
              el.innerHTML = `<span>${w}</span><span class="hint-kind">var</span>`;
            }
          });
        }
      }

      if (!matches.length) return null;
      return {
        list: matches,
        from: CodeMirror.Pos(cur.line, token.start),
        to: CodeMirror.Pos(cur.line, token.end)
      };
    }

    // 2. Multi-File State
    const files = {
      "main.py": `# PyStudio 3.12 — Dedicated WebWorker Engine (Crash-Proof & Ultra-Fast)\n\nname = "Developer"\nprint(f"Hello, {name}! Instant VS Code speed ready.")\n`
    };
    let activeFileName = "main.py";

    // 3. Initialize CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
      mode: "python",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      smartIndent: true,
      lineWrapping: window.innerWidth <= 820,
      matchBrackets: true,
      spellcheck: false,
      autocorrect: false,
      autocapitalize: false,
      hintOptions: {
        hint: pythonHintProvider,
        completeSingle: false,
        extraKeys: {
          Enter: (cm, handle) => handle.pick(),
          Tab: (cm, handle) => handle.pick()
        }
      },
      extraKeys: {
        "Ctrl-Enter": () => runPythonCode(),
        "Cmd-Enter": () => runPythonCode(),
        "Ctrl-Space": "autocomplete",
        Backspace: (cm) => {
          if (!cm.somethingSelected()) {
            const cur = cm.getCursor();
            const line = cm.getLine(cur.line);
            const prev = line[cur.ch - 1];
            const next = line[cur.ch];
            const pairs = { "(": ")", "[": "]", "{": "}", '"': '"', "'": "'" };
            if (prev && pairs[prev] === next) {
              cm.replaceRange("", { line: cur.line, ch: cur.ch - 1 }, { line: cur.line, ch: cur.ch + 1 });
              return;
            }
          }
          return CodeMirror.Pass;
        },
        Tab: (cm) => {
          if (cm.somethingSelected()) {
            cm.indentSelection("add");
          } else {
            cm.replaceSelection("    ", "end");
          }
        }
      }
    });

    editor.setValue(files["main.py"]);

    // 4. Universal Auto-Close Brackets & Quotes (Mobile IME + Desktop)
    const AUTO_PAIRS = { "(": ")", "[": "]", "{": "}", '"': '"', "'": "'" };
    const CLOSING_CHARS = new Set([")", "]", "}", '"', "'"]);
    let isAutoClosing = false;
    let hintTimer = null;

    editor.on("inputRead", (cm, change) => {
      if (isAutoClosing || change.origin !== "+input") return;
      if (change.text.length !== 1 || change.text[0].length !== 1) return;

      const ch = change.text[0];
      const cur = cm.getCursor();
      const line = cm.getLine(cur.line);
      const nextChar = line[cur.ch];

      if (CLOSING_CHARS.has(ch) && nextChar === ch && !AUTO_PAIRS[ch]) {
        isAutoClosing = true;
        cm.replaceRange("", { line: cur.line, ch: cur.ch - 1 }, cur, "+autoclose");
        cm.setCursor({ line: cur.line, ch: cur.ch });
        isAutoClosing = false;
        return;
      }

      if ((ch === '"' || ch === "'") && nextChar === ch) {
        isAutoClosing = true;
        cm.replaceRange("", { line: cur.line, ch: cur.ch - 1 }, cur, "+autoclose");
        cm.setCursor({ line: cur.line, ch: cur.ch });
        isAutoClosing = false;
        return;
      }

      if (AUTO_PAIRS[ch]) {
        isAutoClosing = true;
        cm.replaceRange(AUTO_PAIRS[ch], cur, cur, "+autoclose");
        cm.setCursor(cur);
        isAutoClosing = false;
        return;
      }

      if (/[a-zA-Z_]/.test(ch)) {
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => {
          if (!cm.state.completionActive) cm.showHint();
        }, 65);
      }
    });

    // 5. Dedicated Background WebWorker for Pyodide (Zero UI Lag + Infinite Loop Recovery)
    const workerCode = `
      importScripts("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");

      let pyodide = null;
      let pendingInputResolve = null;

      self.__workerInput = (promptText) => {
        return new Promise((resolve) => {
          pendingInputResolve = resolve;
          self.postMessage({ type: "stdin_request", prompt: String(promptText || "") });
        });
      };

      const initPromise = (async () => {
        try {
          pyodide = await loadPyodide({
            stdout: (text) => self.postMessage({ type: "stdout", text }),
            stderr: (text) => self.postMessage({ type: "stderr", text })
          });

          await pyodide.runPythonAsync(\`
import builtins, ast, json, js

async def _async_input(prompt=""):
    return await js.__workerInput(str(prompt))

builtins.input = _async_input

def __check_syntax(src):
    try:
        ast.parse(src)
        return json.dumps({"ok": True})
    except SyntaxError as e:
        return json.dumps({
            "ok": False,
            "line": e.lineno or 1,
            "msg": e.msg or "Invalid syntax"
        })
          \`);

          self.postMessage({ type: "ready" });
        } catch (err) {
          self.postMessage({ type: "init_error", error: err.message });
        }
      })();

      self.onmessage = async (e) => {
        const msg = e.data;

        if (msg.type === "stdin_response") {
          if (pendingInputResolve) {
            const res = pendingInputResolve;
            pendingInputResolve = null;
            res(msg.value);
          }
          return;
        }

        if (msg.type === "lint") {
          if (!pyodide) return;
          try {
            pyodide.globals.set("__lint_src__", msg.code);
            const raw = pyodide.runPython("__check_syntax(__lint_src__)");
            self.postMessage({ type: "lint_result", result: JSON.parse(raw) });
          } catch {}
          return;
        }

        if (msg.type === "run") {
          await initPromise;
          if (!pyodide) return;

          for (const [fname, content] of Object.entries(msg.files)) {
            pyodide.FS.writeFile(fname, content, { encoding: "utf8" });
          }

          const rawCode = msg.files[msg.activeFile] || "";
          const transformed = rawCode.replace(/(?<!await\\s)\\binput\\s*\\(/g, "await input(");

          const t0 = performance.now();
          try {
            await pyodide.runPythonAsync(transformed);
            const elapsed = (performance.now() - t0).toFixed(1);
            self.postMessage({ type: "done", elapsed });
          } catch (err) {
            const elapsed = (performance.now() - t0).toFixed(1);
            self.postMessage({ type: "run_error", error: err.message, elapsed });
          }
        }
      };
    `;

    let pyWorker = null;
    let workerReady = false;
    let isRunning = false;

    const runtimeStatus = document.getElementById("runtimeStatus");
    const statusText = document.getElementById("statusText");
    const liveLintBar = document.getElementById("liveLintBar");
    const lintBadge = document.getElementById("lintBadge");
    const lintMsg = document.getElementById("lintMsg");
    const outputPage = document.getElementById("outputPage");
    const outputConsole = document.getElementById("outputConsole");
    const outputFileTitle = document.getElementById("outputFileTitle");
    const execMeta = document.getElementById("execMeta");
    const stopRunBtn = document.getElementById("stopRunBtn");

    let errorLineHandle = null;
    let lastErrorLine = null;
    let lintTimer = null;

    function clearErrorHighlight() {
      if (errorLineHandle !== null) {
        editor.removeLineClass(errorLineHandle, "background", "cm-error-line");
        errorLineHandle = null;
      }
      lastErrorLine = null;
      liveLintBar.classList.remove("has-error");
      lintBadge.textContent = "OK";
      lintMsg.textContent = "No syntax errors";
    }

    function appendOutputLine(text, cls = "stdout") {
      const div = document.createElement("div");
      div.className = `out-line ${cls}`;
      div.textContent = text;
      outputConsole.appendChild(div);
      outputConsole.scrollTop = outputConsole.scrollHeight;
    }

    function spawnPythonWorker() {
      if (pyWorker) pyWorker.terminate();
      workerReady = false;
      runtimeStatus.classList.remove("ready", "running");
      statusText.textContent = "Booting Engine...";

      const blob = new Blob([workerCode], { type: "application/javascript" });
      const url = URL.createObjectURL(blob);
      pyWorker = new Worker(url);
      URL.revokeObjectURL(url);

      pyWorker.onmessage = (e) => {
        const data = e.data;

        if (data.type === "ready") {
          workerReady = true;
          runtimeStatus.classList.add("ready");
          statusText.textContent = "Python 3.12 Ready";
          triggerLiveLint();
        } else if (data.type === "lint_result") {
          const res = data.result;
          if (res.ok) {
            clearErrorHighlight();
          } else {
            if (errorLineHandle !== null) {
              editor.removeLineClass(errorLineHandle, "background", "cm-error-line");
            }
            const lineIdx = Math.max(0, Math.min(editor.lineCount() - 1, (res.line || 1) - 1));
            errorLineHandle = editor.addLineClass(lineIdx, "background", "cm-error-line");
            lastErrorLine = lineIdx;
            liveLintBar.classList.add("has-error");
            lintBadge.textContent = `Line ${res.line}`;
            lintMsg.textContent = `SyntaxError: ${res.msg}`;
          }
        } else if (data.type === "stdout") {
          appendOutputLine(data.text, "stdout");
        } else if (data.type === "stderr") {
          appendOutputLine(data.text, "stderr");
        } else if (data.type === "stdin_request") {
          const row = document.createElement("div");
          row.className = "stdin-row";

          const label = document.createElement("span");
          label.className = "stdin-prompt";
          label.textContent = data.prompt || "❯";

          const input = document.createElement("input");
          input.type = "text";
          input.className = "stdin-input";
          input.placeholder = "Type input & press Enter...";

          row.appendChild(label);
          row.appendChild(input);
          outputConsole.appendChild(row);
          outputConsole.scrollTop = outputConsole.scrollHeight;
          input.focus();

          input.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") {
              ev.preventDefault();
              const val = input.value;
              row.remove();
              appendOutputLine(`${data.prompt || ""}${val}`, "stdout");
              pyWorker.postMessage({ type: "stdin_response", value: val });
            }
          });
        } else if (data.type === "done") {
          isRunning = false;
          runtimeStatus.classList.remove("running");
          stopRunBtn.classList.remove("visible");
          execMeta.textContent = `${data.elapsed} ms`;
          appendOutputLine(`✓ Completed in ${data.elapsed} ms`, "done");
        } else if (data.type === "run_error") {
          isRunning = false;
          runtimeStatus.classList.remove("running");
          stopRunBtn.classList.remove("visible");
          execMeta.textContent = `Error (${data.elapsed} ms)`;
          appendOutputLine(data.error, "stderr");
        }
      };
    }

    spawnPythonWorker();

    function triggerLiveLint() {
      if (!workerReady || !activeFileName.endsWith(".py")) {
        clearErrorHighlight();
        return;
      }
      const code = editor.getValue();
      if (!code.trim()) {
        clearErrorHighlight();
        return;
      }
      pyWorker.postMessage({ type: "lint", code });
    }

    liveLintBar.addEventListener("click", () => {
      if (lastErrorLine !== null) {
        editor.focus();
        editor.setCursor({ line: lastErrorLine, ch: 0 });
      }
    });

    editor.on("change", () => {
      files[activeFileName] = editor.getValue();
      clearTimeout(lintTimer);
      lintTimer = setTimeout(triggerLiveLint, 200);
    });

    const cursorPosEl = document.getElementById("cursorPos");
    editor.on("cursorActivity", () => {
      const pos = editor.getCursor();
      cursorPosEl.textContent = `Ln ${pos.line + 1}, Col ${pos.ch + 1}`;
    });

    // 6. Instant Execution in Full-Screen Output Page
    function runPythonCode() {
      files[activeFileName] = editor.getValue();

      // Open output page immediately (< 1ms)
      outputFileTitle.textContent = activeFileName;
      outputConsole.innerHTML = "";
      execMeta.textContent = workerReady ? "Running..." : "Starting Engine...";
      outputPage.classList.add("open");

      if (!workerReady) {
        appendOutputLine("Initializing isolated Python 3.12 worker (first load only)...", "system");
      }

      isRunning = true;
      runtimeStatus.classList.add("running");
      stopRunBtn.classList.add("visible");

      pyWorker.postMessage({
        type: "run",
        files: { ...files },
        activeFile: activeFileName
      });
    }

    // Stop / Force-Kill Infinite Loops Instantly
    stopRunBtn.addEventListener("click", () => {
      isRunning = false;
      stopRunBtn.classList.remove("visible");
      execMeta.textContent = "Stopped";
      appendOutputLine("■ Execution stopped by user. Restarting fresh engine...", "stderr");
      spawnPythonWorker();
    });

    document.getElementById("backToEditorBtn").addEventListener("click", () => {
      outputPage.classList.remove("open");
      editor.focus();
    });

    document.getElementById("rerunBtn").addEventListener("click", runPythonCode);
    document.getElementById("runBtn").addEventListener("click", runPythonCode);

    // 7. Multi-File Tabs, Create, Rename & Import File
    const fileTabsContainer = document.getElementById("fileTabs");

    function renderFileTabs() {
      fileTabsContainer.innerHTML = "";
      Object.keys(files).forEach((fname) => {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = `file-tab-btn ${fname === activeFileName ? "active" : ""}`;

        const dot = document.createElement("span");
        dot.className = "file-dot";

        const label = document.createElement("span");
        label.textContent = fname;

        const renameBtn = document.createElement("span");
        renameBtn.className = "tab-action-icon rename";
        renameBtn.textContent = "✎";
        renameBtn.title = `Rename ${fname}`;
        renameBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openRenameFileModal(fname);
        });

        tab.appendChild(dot);
        tab.appendChild(label);
        tab.appendChild(renameBtn);

        if (Object.keys(files).length > 1) {
          const closeBtn = document.createElement("span");
          closeBtn.className = "tab-action-icon close";
          closeBtn.textContent = "×";
          closeBtn.title = `Delete ${fname}`;
          closeBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteFile(fname);
          });
          tab.appendChild(closeBtn);
        }

        tab.addEventListener("click", () => switchFile(fname));
        fileTabsContainer.appendChild(tab);
      });
    }

    function switchFile(fname) {
      if (!files.hasOwnProperty(fname)) return;
      files[activeFileName] = editor.getValue();
      activeFileName = fname;
      editor.setValue(files[fname]);
      editor.focus();
      renderFileTabs();
      triggerLiveLint();
    }

    function deleteFile(fname) {
      if (Object.keys(files).length <= 1) return;
      delete files[fname];
      if (activeFileName === fname) {
        activeFileName = Object.keys(files)[0];
        editor.setValue(files[activeFileName]);
      }
      renderFileTabs();
      triggerLiveLint();
      showToast(`Deleted ${fname}`);
    }

    // Create / Rename Modal
    const fileModal = document.getElementById("fileModal");
    const fileModalTitle = document.getElementById("fileModalTitle");
    const fileModalDesc = document.getElementById("fileModalDesc");
    const fileModalInput = document.getElementById("fileModalInput");
    const confirmFileModalBtn = document.getElementById("confirmFileModalBtn");

    let modalMode = "create";
    let fileBeingRenamed = null;

    function openCreateFileModal() {
      modalMode = "create";
      fileBeingRenamed = null;
      fileModalTitle.textContent = "Create New File";
      fileModalDesc.innerHTML = "Enter any file name (e.g. <code>helper.py</code> or <code>calc</code>).";
      fileModalInput.value = "";
      fileModalInput.placeholder = "my_script.py";
      confirmFileModalBtn.textContent = "Create";
      fileModal.classList.add("open");
      setTimeout(() => fileModalInput.focus(), 40);
    }

    function openRenameFileModal(targetName) {
      modalMode = "rename";
      fileBeingRenamed = targetName;
      fileModalTitle.textContent = `Rename ${targetName}`;
      fileModalDesc.innerHTML = `Enter a new name for <code>${targetName}</code>.`;
      fileModalInput.value = targetName;
      fileModalInput.placeholder = "new_name.py";
      confirmFileModalBtn.textContent = "Rename";
      fileModal.classList.add("open");
      setTimeout(() => {
        fileModalInput.focus();
        fileModalInput.select();
      }, 40);
    }

    function closeFileModal() {
      fileModal.classList.remove("open");
      fileBeingRenamed = null;
      editor.focus();
    }

    function sanitizeFileName(raw) {
      let clean = raw.trim().replace(/[\\/:*?"<>|]/g, "_");
      if (!clean) return "";
      if (!clean.includes(".")) clean = `${clean}.py`;
      return clean;
    }

    function submitFileModal() {
      const nextName = sanitizeFileName(fileModalInput.value);
      if (!nextName) {
        showToast("Enter a valid file name.");
        return;
      }

      if (modalMode === "create") {
        if (!files.hasOwnProperty(nextName)) {
          files[nextName] = `# ${nextName}\n\n`;
        }
        closeFileModal();
        switchFile(nextName);
        showToast(`Opened ${nextName}`);
        return;
      }

      if (modalMode === "rename" && fileBeingRenamed) {
        const oldName = fileBeingRenamed;
        if (nextName === oldName) {
          closeFileModal();
          return;
        }
        if (files.hasOwnProperty(nextName)) {
          showToast(`"${nextName}" already exists.`);
          return;
        }

        if (oldName === activeFileName) {
          files[oldName] = editor.getValue();
        }

        const rebuilt = {};
        for (const [k, v] of Object.entries(files)) {
          rebuilt[k === oldName ? nextName : k] = v;
        }
        Object.keys(files).forEach((k) => delete files[k]);
        Object.assign(files, rebuilt);

        if (activeFileName === oldName) {
          activeFileName = nextName;
        }

        closeFileModal();
        renderFileTabs();
        triggerLiveLint();
        showToast(`Renamed ${oldName} → ${nextName}`);
      }
    }

    document.getElementById("newFileBtn").addEventListener("click", openCreateFileModal);
    document.getElementById("cancelFileModalBtn").addEventListener("click", closeFileModal);
    confirmFileModalBtn.addEventListener("click", submitFileModal);
    fileModalInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submitFileModal(); }
      else if (e.key === "Escape") closeFileModal();
    });

    // Import File
    const importFileInput = document.getElementById("importFileInput");
    document.getElementById("importFileBtn").addEventListener("click", () => {
      importFileInput.value = "";
      importFileInput.click();
    });

    importFileInput.addEventListener("change", async (e) => {
      const selected = Array.from(e.target.files || []);
      if (!selected.length) return;
      let lastImported = null;
      for (const file of selected) {
        const text = await file.text();
        files[file.name] = text;
        lastImported = file.name;
      }
      if (lastImported) {
        switchFile(lastImported);
        showToast(`Imported ${selected.length} file(s)!`);
      }
    });

    renderFileTabs();

    // Bottom Shortcut Symbol Bar
    document.getElementById("shortcutKeys").addEventListener("click", (e) => {
      const btn = e.target.closest(".key-chip");
      if (!btn) return;
      editor.focus();
      const pair = btn.dataset.pair;
      const ins = btn.dataset.insert;
      if (pair) {
        const cur = editor.getCursor();
        editor.replaceSelection(pair);
        editor.setCursor({ line: cur.line, ch: cur.ch + 1 });
      } else if (ins) {
        editor.replaceSelection(ins, "end");
      }
    });

    // Toolbar Actions & Toast
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    document.getElementById("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(editor.getValue());
        showToast(`Copied ${activeFileName}!`);
      } catch {
        showToast("Unable to copy code.");
      }
    });

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const blob = new Blob([editor.getValue()], { type: "text/x-python" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = activeFileName;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`Downloaded ${activeFileName}`);
    });

    window.addEventListener("resize", () => {
      editor.setOption("lineWrapping", window.innerWidth <= 820);
      editor.refresh();
    });
  </script>
</body>
</html>
