<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>PyStudio — Modern Python 3 Web IDE</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- CodeMirror 5 Core & Addons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>

  <!-- Pyodide Python 3 WebAssembly Runtime -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

  <style>
    :root {
      --bg-base: #0d1117;
      --bg-surface: #131822;
      --bg-elevated: #1a2232;
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-glow: rgba(99, 102, 241, 0.45);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-secondary: #06b6d4;
      --success: #10b981;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 12% 0%, rgba(99, 102, 241, 0.12), transparent 36%),
        radial-gradient(circle at 88% 100%, rgba(6, 182, 212, 0.08), transparent 36%);
    }

    /* Header */
    .topbar {
      height: 54px;
      min-height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(19, 24, 34, 0.92);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 20;
      transform: translateZ(0);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .badge-ver {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    /* Status Pill */
    .runtime-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warning);
      box-shadow: 0 0 8px var(--warning);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .runtime-status.ready .status-dot {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .runtime-status.running .status-dot {
      background: var(--accent-secondary);
      box-shadow: 0 0 10px var(--accent-secondary);
    }

    /* Action Toolbar */
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 35px;
      padding: 0 12px;
      border-radius: 9px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
      user-select: none;
      touch-action: manipulation;
    }

    .btn:hover {
      background: #232d42;
      border-color: rgba(148, 163, 184, 0.28);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-run {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #fff;
      padding: 0 15px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-run:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
    }

    .btn-run:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .btn-icon-only {
      padding: 0 10px;
    }

    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      display: none;
    }

    .btn-run.is-loading .spinner {
      display: inline-block;
    }

    .btn-run.is-loading .run-icon {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.2fr 6px 1fr;
      overflow: hidden;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg-surface);
      contain: layout style;
    }

    .pane-header {
      height: 36px;
      min-height: 36px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13, 17, 23, 0.72);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .file-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
    }

    .file-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
    }

    .pane-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Resizer (Desktop) */
    .resizer {
      background: var(--bg-base);
      border-left: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      cursor: col-resize;
      transition: background 0.15s ease;
    }

    .resizer:hover, .resizer.dragging {
      background: var(--accent-primary);
    }

    /* CodeMirror Custom Theme */
    .editor-wrapper {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100% !important;
      width: 100% !important;
      background: transparent !important;
      color: #e2e8f0 !important;
      font-family: var(--font-mono) !important;
      font-size: 14.5px;
      line-height: 1.62;
      padding: 8px 0;
      will-change: transform;
    }

    .CodeMirror-scroll {
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .CodeMirror-gutters {
      background: rgba(13, 17, 23, 0.5) !important;
      border-right: 1px solid var(--border-subtle) !important;
      padding-right: 4px;
    }

    .CodeMirror-linenumber {
      color: #475569 !important;
      font-size: 12px;
    }

    .CodeMirror-cursor {
      border-left: 2px solid #38bdf8 !important;
    }

    .CodeMirror-activeline-background {
      background: rgba(99, 102, 241, 0.08) !important;
    }

    .CodeMirror-selected {
      background: rgba(99, 102, 241, 0.28) !important;
    }

    .CodeMirror-matchingbracket {
      color: #38bdf8 !important;
      font-weight: 700;
      text-decoration: underline;
    }

    /* Syntax Highlighting (Tokyo Night Inspired) */
    .cm-s-default .cm-keyword { color: #c084fc; font-weight: 600; }
    .cm-s-default .cm-builtin { color: #38bdf8; }
    .cm-s-default .cm-def { color: #60a5fa; font-weight: 600; }
    .cm-s-default .cm-variable { color: #e2e8f0; }
    .cm-s-default .cm-variable-2 { color: #93c5fd; }
    .cm-s-default .cm-string { color: #4ade80; }
    .cm-s-default .cm-string-2 { color: #34d399; }
    .cm-s-default .cm-number { color: #fb923c; }
    .cm-s-default .cm-comment { color: #64748b; font-style: italic; }
    .cm-s-default .cm-operator { color: #7dd3fc; }
    .cm-s-default .cm-meta { color: #f472b6; }
    .cm-s-default .cm-atom { color: #f87171; }

    /* Autocomplete Dropdown */
    .CodeMirror-hints {
      background: rgba(20, 26, 38, 0.98) !important;
      border: 1px solid var(--border-glow) !important;
      border-radius: 10px !important;
      padding: 4px !important;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65) !important;
      font-family: var(--font-mono) !important;
      font-size: 13px !important;
      z-index: 9999 !important;
      max-height: 210px !important;
      overflow-y: auto !important;
    }

    .CodeMirror-hint {
      color: var(--text-primary) !important;
      padding: 6px 10px !important;
      border-radius: 6px !important;
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
    }

    li.CodeMirror-hint-active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.38), rgba(6, 182, 212, 0.25)) !important;
      color: #fff !important;
    }

    .hint-kind {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
    }

    /* Mobile Quick-Symbol Bar (Hidden on Desktop) */
    .mobile-keys {
      display: none;
      height: 40px;
      min-height: 40px;
      background: #0f141e;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      padding: 4px 8px;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .mobile-keys::-webkit-scrollbar {
      display: none;
    }

    .key-chip {
      flex: 0 0 auto;
      min-width: 38px;
      height: 30px;
      padding: 0 10px;
      border-radius: 7px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key-chip:active {
      background: var(--accent-primary);
      color: #fff;
    }

    /* Output Terminal */
    .console-body {
      flex: 1;
      min-height: 0;
      padding: 14px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.6;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .console-line {
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeSlide 0.16s ease-out;
    }

    .console-line.stderr {
      color: #fda4af;
      background: rgba(244, 63, 94, 0.09);
      border-left: 3px solid var(--danger);
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
      margin: 4px 0;
    }

    .console-line.system {
      color: var(--text-muted);
      font-size: 12px;
    }

    .console-line.success-banner {
      color: #6ee7b7;
      font-size: 12px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.18);
    }

    /* Interactive input() prompt inside console */
    .stdin-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid var(--border-glow);
    }

    .stdin-prompt {
      color: #7dd3fc;
      white-space: pre-wrap;
    }

    .stdin-input {
      flex: 1;
      min-width: 60px;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 14px;
    }

    .btn-clear-sm {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-clear-sm:hover {
      color: var(--text-primary);
      border-color: rgba(148, 163, 184, 0.35);
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      padding: 9px 15px;
      border-radius: 10px;
      background: rgba(26, 34, 50, 0.96);
      border: 1px solid var(--border-glow);
      color: #fff;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive Mobile & Tablet Layout */
    @media (max-width: 820px) {
      .topbar {
        padding: 0 10px;
        height: 50px;
        min-height: 50px;
      }

      .brand-title span.title-text {
        font-size: 14px;
      }

      .runtime-status .status-label {
        display: none;
      }

      .runtime-status {
        padding: 5px 8px;
      }

      .btn {
        height: 34px;
        padding: 0 10px;
        font-size: 12.5px;
      }

      .btn .btn-label-hide-sm {
        display: none;
      }

      .workspace {
        display: flex;
        flex-direction: column;
      }

      .resizer {
        display: none;
      }

      .editor-pane {
        flex: 1.15;
        min-height: 180px;
      }

      .mobile-keys {
        display: flex;
      }

      .output-pane {
        flex: 0.85;
        min-height: 150px;
        border-top: 1px solid var(--border-subtle);
      }

      .CodeMirror {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">Py</div>
      <div class="brand-title">
        <span class="title-text">PyStudio</span>
        <span class="badge-ver">3.12</span>
      </div>
      <div id="runtimeStatus" class="runtime-status" title="Python WebAssembly Engine Status">
        <span class="status-dot"></span>
        <span id="statusText" class="status-label">Loading Python...</span>
      </div>
    </div>

    <div class="toolbar-actions">
      <button id="copyBtn" class="btn btn-icon-only" title="Copy Code">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span class="btn-label-hide-sm">Copy</span>
      </button>

      <button id="downloadBtn" class="btn btn-icon-only" title="Download main.py">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span class="btn-label-hide-sm">.py</span>
      </button>

      <button id="runBtn" class="btn btn-run" title="Run Code (Ctrl + Enter)">
        <span class="spinner"></span>
        <svg class="run-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <span id="runBtnText">Run</span>
      </button>
    </div>
  </header>

  <!-- Main IDE Workspace -->
  <main id="workspace" class="workspace">
    <!-- Code Editor Pane -->
    <section id="editorPane" class="pane editor-pane">
      <div class="pane-header">
        <div class="file-tab">
          <span class="file-dot"></span>
          <span>main.py</span>
        </div>
        <div class="pane-meta">
          <span id="cursorPos">Ln 1, Col 1</span>
        </div>
      </div>

      <div class="editor-wrapper">
        <textarea id="codeEditor"># Welcome to PyStudio!
# Type 'pr' and press Enter for autocomplete, or click Run.

name = "Developer"
print(f"Hello, {name}! Python 3 is ready.")

for i in range(1, 4):
    print(f"Step {i}: Smooth & fast!")
</textarea>
      </div>

      <!-- Mobile Quick Symbol Bar -->
      <div id="mobileKeys" class="mobile-keys" aria-label="Quick Python Symbols">
        <button type="button" class="key-chip" data-insert="    ">Tab</button>
        <button type="button" class="key-chip" data-pair="()">()</button>
        <button type="button" class="key-chip" data-pair='""'>""</button>
        <button type="button" class="key-chip" data-pair="''">''</button>
        <button type="button" class="key-chip" data-insert=":">:</button>
        <button type="button" class="key-chip" data-insert="=">=</button>
        <button type="button" class="key-chip" data-pair="[]">[]</button>
        <button type="button" class="key-chip" data-pair="{}">{}</button>
        <button type="button" class="key-chip" data-insert="#">#</button>
        <button type="button" class="key-chip" data-insert="_">_</button>
      </div>
    </section>

    <!-- Draggable Split Resizer (PC) -->
    <div id="resizer" class="resizer" title="Drag to resize"></div>

    <!-- Output Terminal Pane -->
    <section id="outputPane" class="pane output-pane">
      <div class="pane-header">
        <div class="file-tab">
          <span style="color:#10b981;">❯_</span>
          <span>Console Output</span>
        </div>
        <div class="pane-meta">
          <span id="execTime"></span>
          <button id="clearConsoleBtn" class="btn-clear-sm">Clear</button>
        </div>
      </div>

      <div id="consoleOutput" class="console-body">
        <div class="console-line system">Initializing Python 3.12 runtime... Ready in a moment.</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    // 1. Python Keywords & Built-ins Dictionary for Smart Autocomplete
    const PYTHON_COMPLETIONS = [
      { text: "print", kind: "func" },
      { text: "input", kind: "func" },
      { text: "range", kind: "func" },
      { text: "len", kind: "func" },
      { text: "int", kind: "type" },
      { text: "str", kind: "type" },
      { text: "float", kind: "type" },
      { text: "bool", kind: "type" },
      { text: "list", kind: "type" },
      { text: "dict", kind: "type" },
      { text: "set", kind: "type" },
      { text: "tuple", kind: "type" },
      { text: "def", kind: "kw" },
      { text: "return", kind: "kw" },
      { text: "if", kind: "kw" },
      { text: "elif", kind: "kw" },
      { text: "else", kind: "kw" },
      { text: "for", kind: "kw" },
      { text: "while", kind: "kw" },
      { text: "break", kind: "kw" },
      { text: "continue", kind: "kw" },
      { text: "pass", kind: "kw" },
      { text: "import", kind: "kw" },
      { text: "from", kind: "kw" },
      { text: "as", kind: "kw" },
      { text: "class", kind: "kw" },
      { text: "try", kind: "kw" },
      { text: "except", kind: "kw" },
      { text: "finally", kind: "kw" },
      { text: "raise", kind: "kw" },
      { text: "with", kind: "kw" },
      { text: "lambda", kind: "kw" },
      { text: "yield", kind: "kw" },
      { text: "True", kind: "val" },
      { text: "False", kind: "val" },
      { text: "None", kind: "val" },
      { text: "and", kind: "kw" },
      { text: "or", kind: "kw" },
      { text: "not", kind: "kw" },
      { text: "in", kind: "kw" },
      { text: "is", kind: "kw" },
      { text: "enumerate", kind: "func" },
      { text: "zip", kind: "func" },
      { text: "map", kind: "func" },
      { text: "filter", kind: "func" },
      { text: "sorted", kind: "func" },
      { text: "reversed", kind: "func" },
      { text: "sum", kind: "func" },
      { text: "min", kind: "func" },
      { text: "max", kind: "func" },
      { text: "abs", kind: "func" },
      { text: "round", kind: "func" },
      { text: "type", kind: "func" },
      { text: "isinstance", kind: "func" },
      { text: "open", kind: "func" },
      { text: "format", kind: "func" }
    ];

    function pythonHintProvider(cm) {
      const cur = cm.getCursor();
      const token = cm.getTokenAt(cur);
      const word = token.string;

      if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(word)) return null;

      const lower = word.toLowerCase();
      const seen = new Set();
      const matches = [];

      // Match built-in Python keywords & functions
      for (const item of PYTHON_COMPLETIONS) {
        if (item.text.toLowerCase().startsWith(lower) && item.text !== word) {
          seen.add(item.text);
          matches.push({
            text: item.text,
            render(el) {
              el.innerHTML = `<span>${item.text}</span><span class="hint-kind">${item.kind}</span>`;
            }
          });
        }
      }

      // Also collect user-defined variables/functions from the editor
      const docWords = cm.getValue().match(/\b[a-zA-Z_][a-zA-Z0-9_]{1,}\b/g) || [];
      for (const w of docWords) {
        if (!seen.has(w) && w !== word && w.toLowerCase().startsWith(lower)) {
          seen.add(w);
          matches.push({
            text: w,
            render(el) {
              el.innerHTML = `<span>${w}</span><span class="hint-kind">var</span>`;
            }
          });
        }
      }

      if (!matches.length) return null;

      return {
        list: matches,
        from: CodeMirror.Pos(cur.line, token.start),
        to: CodeMirror.Pos(cur.line, token.end)
      };
    }

    // 2. Initialize CodeMirror with Auto-Close Brackets/Quotes & Enter-to-Complete
    const editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
      mode: "python",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      smartIndent: true,
      lineWrapping: window.innerWidth <= 820,
      matchBrackets: true,
      autoCloseBrackets: {
        pairs: "()[]{}''\"\"",
        closeBefore: ")]}'\":;>",
        triples: "'\"",
        explode: "[]{}"
      },
      spellcheck: false,
      autocorrect: false,
      autocapitalize: false,
      hintOptions: {
        hint: pythonHintProvider,
        completeSingle: false,
        extraKeys: {
          Enter: (cm, handle) => handle.pick(),
          Tab: (cm, handle) => handle.pick()
        }
      },
      extraKeys: {
        "Ctrl-Enter": () => runPythonCode(),
        "Cmd-Enter": () => runPythonCode(),
        "Ctrl-Space": "autocomplete",
        Tab: (cm) => {
          if (cm.somethingSelected()) {
            cm.indentSelection("add");
          } else {
            cm.replaceSelection("    ", "end");
          }
        }
      }
    });

    // Debounced auto-trigger for IntelliSense popup while typing (prevents lag on mobile)
    let hintTimer = null;
    editor.on("inputRead", (cm, change) => {
      if (change.origin !== "+input") return;
      const ch = change.text[0];
      if (!ch || !/[a-zA-Z_]/.test(ch)) return;

      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        if (!cm.state.completionActive) {
          cm.showHint();
        }
      }, 65);
    });

    // Update Ln/Col indicator smoothly
    const cursorPosEl = document.getElementById("cursorPos");
    editor.on("cursorActivity", () => {
      const pos = editor.getCursor();
      cursorPosEl.textContent = `Ln ${pos.line + 1}, Col ${pos.ch + 1}`;
    });

    // Mobile Quick-Symbol Toolbar Handler
    document.getElementById("mobileKeys").addEventListener("click", (e) => {
      const btn = e.target.closest(".key-chip");
      if (!btn) return;
      editor.focus();
      const pair = btn.dataset.pair;
      const ins = btn.dataset.insert;
      if (pair) {
        const cur = editor.getCursor();
        editor.replaceSelection(pair);
        editor.setCursor({ line: cur.line, ch: cur.ch + 1 });
      } else if (ins) {
        editor.replaceSelection(ins, "end");
      }
    });

    // 3. Pyodide Runtime Setup & Interactive Console
    const consoleOutput = document.getElementById("consoleOutput");
    const runBtn = document.getElementById("runBtn");
    const runBtnText = document.getElementById("runBtnText");
    const runtimeStatus = document.getElementById("runtimeStatus");
    const statusText = document.getElementById("statusText");
    const execTimeEl = document.getElementById("execTime");

    let pyodide = null;
    let isRunning = false;

    function appendConsole(text, type = "stdout") {
      const div = document.createElement("div");
      div.className = `console-line ${type}`;
      div.textContent = text;
      consoleOutput.appendChild(div);
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function clearConsole() {
      consoleOutput.innerHTML = "";
      execTimeEl.textContent = "";
    }

    // Async input() bridge inside the terminal
    window.__pyStudioInput = (promptText) => {
      return new Promise((resolve) => {
        const row = document.createElement("div");
        row.className = "stdin-row";

        const label = document.createElement("span");
        label.className = "stdin-prompt";
        label.textContent = promptText || "❯";

        const input = document.createElement("input");
        input.type = "text";
        input.className = "stdin-input";
        input.placeholder = "Type input & press Enter...";

        row.appendChild(label);
        row.appendChild(input);
        consoleOutput.appendChild(row);
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
        input.focus();

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            const val = input.value;
            row.remove();
            appendConsole(`${promptText || ""}${val}`, "stdout");
            resolve(val);
          }
        });
      });
    };

    const pyodideReadyPromise = (async () => {
      try {
        pyodide = await loadPyodide({
          stdout: (msg) => appendConsole(msg, "stdout"),
          stderr: (msg) => appendConsole(msg, "stderr")
        });

        await pyodide.runPythonAsync(`
import builtins, js

async def _async_input(prompt=""):
    return await js.__pyStudioInput(str(prompt))

builtins.input = _async_input
        `);

        runtimeStatus.classList.add("ready");
        statusText.textContent = "Python 3.12 Ready";
        clearConsole();
        appendConsole("Python 3.12 ready. Press Run or Ctrl+Enter.", "system");
      } catch (err) {
        statusText.textContent = "Load Failed";
        appendConsole("Failed to load Python runtime: " + err.message, "stderr");
      }
    })();

    async function runPythonCode() {
      if (isRunning) return;
      isRunning = true;
      runBtn.disabled = true;
      runBtn.classList.add("is-loading");
      runBtnText.textContent = "Running";
      runtimeStatus.classList.add("running");
      clearConsole();

      if (!pyodide) {
        appendConsole("Waiting for Python 3.12 runtime to finish loading...", "system");
        await pyodideReadyPromise;
        clearConsole();
      }

      const rawCode = editor.getValue();
      // Automatically await input() calls if user writes standard synchronous input()
      const transformedCode = rawCode.replace(/(?<!await\s)\binput\s*\(/g, "await input(");

      const startTime = performance.now();
      try {
        await pyodide.runPythonAsync(transformedCode);
        const elapsed = (performance.now() - startTime).toFixed(1);
        execTimeEl.textContent = `${elapsed} ms`;
        appendConsole(`✓ Finished in ${elapsed} ms`, "success-banner");
      } catch (err) {
        const elapsed = (performance.now() - startTime).toFixed(1);
        execTimeEl.textContent = `${elapsed} ms`;
        appendConsole(err.message, "stderr");
      } finally {
        isRunning = false;
        runBtn.disabled = false;
        runBtn.classList.remove("is-loading");
        runBtnText.textContent = "Run";
        runtimeStatus.classList.remove("running");
      }
    }

    // 4. Toolbar Button Actions & Toast
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    runBtn.addEventListener("click", runPythonCode);
    document.getElementById("clearConsoleBtn").addEventListener("click", clearConsole);

    document.getElementById("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(editor.getValue());
        showToast("Code copied to clipboard!");
      } catch {
        showToast("Unable to copy code.");
      }
    });

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const blob = new Blob([editor.getValue()], { type: "text/x-python" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "main.py";
      a.click();
      URL.revokeObjectURL(url);
      showToast("Downloaded main.py");
    });

    // 5. Smooth Desktop Split Resizer (Zero-lag with requestAnimationFrame)
    const resizer = document.getElementById("resizer");
    const workspace = document.getElementById("workspace");
    let resizing = false;

    resizer.addEventListener("mousedown", () => {
      resizing = true;
      resizer.classList.add("dragging");
      document.body.style.cursor = "col-resize";
    });

    window.addEventListener("mousemove", (e) => {
      if (!resizing) return;
      requestAnimationFrame(() => {
        const totalWidth = workspace.clientWidth;
        const leftPct = Math.min(80, Math.max(20, (e.clientX / totalWidth) * 100));
        workspace.style.gridTemplateColumns = `${leftPct}% 6px ${100 - leftPct}%`;
        editor.refresh();
      });
    });

    window.addEventListener("mouseup", () => {
      if (!resizing) return;
      resizing = false;
      resizer.classList.remove("dragging");
      document.body.style.cursor = "";
    });

    // Refresh editor layout smoothly on orientation/viewport change
    window.addEventListener("resize", () => {
      editor.setOption("lineWrapping", window.innerWidth <= 820);
      editor.refresh();
    });
  </script>
</body>
</html>
